# Release: a `v*` tag runs the full suite (the same ci.yml as every pull request), builds the wheel
# and the SBOM, checks the changelog, and publishes them as a GitHub release (DECISIONS #105).
# The publish job is the only one that can write; nothing else holds a token with write access.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: full suite
    uses: ./.github/workflows/ci.yml

  build:
    name: wheel, SBOM, notes
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Install ffmpeg (pinned, checksum-verified)
        uses: ./.github/actions/setup-ffmpeg
      - name: Release notes (the tag must be the project version and the changelog must have it)
        run: |
          uv sync --locked
          uv run --locked python scripts/release_notes.py "$GITHUB_REF_NAME" > RELEASE_NOTES.md
      - name: Wheel, SBOM and checksums
        run: make release-assets
      - name: Smoke test the wheel on a synthetic film (fresh environment, no source tree)
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          ffmpeg -v error -f lavfi -i testsrc=d=6:r=12 -f lavfi -i sine=d=6 -shortest "$RUNNER_TEMP/smoke.mp4"
          "$RUNNER_TEMP/smoke/bin/filmanalyser" --version
          "$RUNNER_TEMP/smoke/bin/filmanalyser" "$RUNNER_TEMP/smoke.mp4" --out "$RUNNER_TEMP/smoke-out"
          test -s "$RUNNER_TEMP/smoke-out/report.html"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.whl
            dist/*.json
            dist/SHA256SUMS
            RELEASE_NOTES.md
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Verify the checksums, then publish
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.json dist/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
