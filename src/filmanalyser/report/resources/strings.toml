# All user-facing text (report and CLI). Nested tables become dotted keys: [app] name -> app.name.
# Placeholders use $name / ${name} (string.Template), never str.format.

[app]
name = "FilmAnalyser"
tagline = "A craft analyser: it measures form and flags notable sections with timestamps."

[cli]
version = "$name $version"
prog = "filmanalyser"
arg_film = "film"
help_film = "The film to analyse (an mp4 file)."
help_out = "The folder for the feature store. A second run with the same folder resumes."
help_report = "Where to write the HTML report (default: report.html inside the output folder)."
help_verbose = "Print structured progress events to stderr."
done = "Analysed $film: $cuts hard cuts. Report written to $report."

# Every error category has a `default` message; specific messages sit beside it. Placeholders are
# filled from the error's fields (basenames only, never full paths).
[error.internal]
default = "An unexpected internal error occurred."

[error.input]
default = "The input is invalid."
bad_setting = "The setting '$name' has an invalid value."
not_found = "The file '$name' does not exist."
not_a_file = "'$name' is not a regular file."
unreadable = "The file '$name' cannot be read (check its permissions)."
invalid_path = "The path '$name' is not valid."

[error.decode]
default = "The film could not be decoded."
tool_missing = "The required tool '$tool' was not found. Install ffmpeg (it provides ffprobe)."
probe_failed = "'$name' could not be inspected; it may not be a valid video file."
no_video = "'$name' contains no video stream."
no_duration = "The length of '$name' could not be determined."
ffmpeg_failed = "ffmpeg stopped while decoding '$name' (exit code $code)."
no_frames = "No video frames could be decoded from '$name'."

[error.model]
default = "A model file is missing or failed its integrity check."

[error.storage]
default = "The feature store is unreadable or incompatible."
bad_directory = "'$name' cannot be used as part of the output location (it must be a plain folder or file name, not a link, traversal or other kind of file)."
write_failed = "'$name' could not be written; check the free space and permissions."
bad_schema = "The feature schema is invalid: '$name'."
bad_features = "'$name' does not match the feature schema, so nothing was stored."
out_of_order = "Chunk $got cannot be stored: chunk $expected is next (results are append-only)."
already_complete = "The results in '$name' are already complete."
manifest_corrupt = "The progress record '$name' is damaged. Delete the output folder to start over."
chunk_corrupt = "The stored features file '$name' is missing or damaged. Delete the output folder to start over."
input_mismatch = "The results in '$name' were made from a different film. Use another output folder."
features_mismatch = "The results in '$name' were made with different extractor versions. Use another output folder."
settings_mismatch = "The results in '$name' were made with different chunk settings. Use another output folder."

[error.analysis]
default = "The analysis could not be completed."

[report]
title = "Shot cut report"
film = "Film"
film_minutes = "Film length (minutes)"
total_cuts = "Hard cuts found"
average_shot = "Average shot length (seconds)"

[chart.cut_rate]
label = "Hard cuts per minute over the film"
caption = "Hard cuts per minute, one point per chunk, against film time."

