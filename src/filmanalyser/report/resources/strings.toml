# All user-facing text (report and CLI). Nested tables become dotted keys: [app] name -> app.name.
# Placeholders use $name / ${name} (string.Template), never str.format.

[app]
name = "FilmAnalyser"
tagline = "A craft analyser: it measures form and flags notable sections with timestamps."

[cli]
version = "$name $version"
prog = "filmanalyser"
arg_film = "film"
help_film = "The film to analyse (an mp4 file)."
help_out = "The folder for the feature store and the report (default: the film's name plus .analysis, in the working folder). A second run with the same folder resumes."
help_report = "Where to write the HTML report (default: report.html inside the output folder)."
help_verbose = "Print structured progress events to stderr."
help_separate_voices = "Also find speech under loud music by separating the voice (needs the demucs tool; separation runs at about 10 times real time on an Apple M4 GPU, 4 times on its CPU). A 5.1 film uses its centre channel instead."
help_separation_model = "The folder holding the voice-separation model (fetch it with make separation-model)."
help_fresh = "Discard any stored results in the output folder and analyse from the start (the default is to resume)."
interrupted = "Stopped. Nothing is lost: run the same command again to resume where it stopped."
done = "Analysed $film: $cuts hard cuts. Report written to $report."

# Every error category has a `default` message; specific messages sit beside it. Placeholders are
# filled from the error's fields (basenames only, never full paths).
[error.internal]
default = "An unexpected internal error occurred."

[error.input]
no_separator = "Voice separation needs the '$tool' tool on PATH. Install it once (for example `uv tool install demucs==4.1.0`), then fetch its model with `make separation-model`."
default = "The input is invalid."
bad_setting = "The setting '$name' has an invalid value."
not_found = "The file '$name' does not exist."
not_a_file = "'$name' is not a regular file."
unreadable = "The file '$name' cannot be read (check its permissions)."
invalid_path = "The path '$name' is not valid."
report_unwritable = "The report '$name' cannot be written: its folder must exist and the file must not be a link."
report_is_film = "The report '$name' is the film itself and would overwrite it."

[error.decode]
separation_failed = "Voice separation stopped (exit code $code)."
default = "The film could not be decoded."
tool_missing = "The required tool '$tool' was not found. Install ffmpeg (it provides ffprobe)."
probe_failed = "'$name' could not be inspected; it may not be a valid video file."
no_video = "'$name' contains no video stream."
no_duration = "The length of '$name' could not be determined."
ffmpeg_failed = "ffmpeg stopped while decoding '$name' (exit code $code)."
no_frames = "No video frames could be decoded from '$name'."
audio_failed = "The audio of '$name' could not be decoded."

[error.model]
separation = "The voice-separation model file '$name' is missing or failed its integrity check. Fetch it with `make separation-model`."
default = "A model file is missing or failed its integrity check."

[error.storage]
default = "The feature store is unreadable or incompatible."
bad_directory = "'$name' cannot be used as part of the output location (it must be a plain folder or file name, not a link, traversal or other kind of file)."
write_failed = "'$name' could not be written; check the free space and permissions."
bad_schema = "The feature schema is invalid: '$name'."
bad_features = "'$name' does not match the feature schema, so nothing was stored."
out_of_order = "Chunk $got cannot be stored: chunk $expected is next (results are append-only)."
already_complete = "The results in '$name' are already complete."
manifest_corrupt = "The progress record '$name' is damaged. Delete the output folder to start over."
chunk_corrupt = "The stored features file '$name' is missing or damaged. Delete the output folder to start over."
input_mismatch = "The results in '$name' were made from a different film. Use another output folder."
features_mismatch = "The results in '$name' were made with different extractor versions. Use another output folder."
settings_mismatch = "The results in '$name' were made with different chunk settings. Use another output folder."

[error.analysis]
default = "The analysis could not be completed."
bad_timeline = "The stored results cannot be analysed: '$name' is missing or unusable."

[report]
title = "Film analysis report"
film = "Film"
length = "Film length"
chunks = "Chunks analysed"
empty = "No chunks were analysed, so there is nothing to report."

[notice]
heading = "Read this first"
unvalidated = "These are observations, not findings. The act breaks, the tension peak, the pacing plateaus and the flags below are unvalidated (open items P6-1 and P6-2): their rules and thresholds were calibrated on synthetic data only, and no film with known act structure or a known climax has been checked against them."

[section]
overview = "Overview"
charts = "Curves"
acts = "Act breaks"
tension = "Tension"
pacing = "Pacing"
flags = "Flagged moments"

[overview]
total_cuts = "Hard cuts found"
average_shot = "Average shot length (seconds)"
mean_rate = "Mean cut rate (cuts and gradual transitions per minute)"

[act]
note = "A break is where the film's measured state changes most, inside the two zones where an act break classically falls. None is forced: a zone with no strong enough change has no break."
features = "Features compared:"
col_time = "Time"
col_share = "Share of the film (%)"
col_score = "Change score"
col_moved = "Moved most"
none = "No act break was found."
spans = "The film in acts"
span = "Act $number: $start to $end"

[act.audio]
used = "Sound was used: the loudness, speech, tonal and silence measurements are part of the comparison."
not_used = "Sound was not used: this film has no audio measurements, so the breaks come from the picture alone."

[act.zone]
found = "Zone $zone: a break at $time."
empty = "Zone $zone: no break found."
too_short = "Zone $zone: too short to judge (needs $needs)."

[tension]
note = "Tension is the mean of how fast the film is cut and how loud it is, each measured against the film's own average. It is a relative measure, not a rating."
components = "Made of:"
peak = "Peak at $time, $height standard deviations above the film's average."
no_peak = "No tension peak reached the minimum height."
minimum = "A peak is reported only from $height standard deviations above the average."

[pacing]
mean = "Mean cut rate: $rate cuts and gradual transitions per minute."
plateaus = "Plateaus: stretches that keep one cutting speed while the film around them varies."
none = "No plateau was found."
col_span = "Stretch"
col_rate = "Cuts per minute"
span = "$start to $end"

[flags]
note = "Each flag says which rule raised it. Consecutive chunks that raise the same rule are one flag."
none = "No moment was flagged."
col_time = "Time"
col_kind = "Flag"
col_value = "Measured"
span = "$start to $end"

[flag.kind]
fast_cutting = "Fast cutting: cut rate far above the film's usual"
loud = "Loud: loudness far above the film's usual"
quiet = "Quiet: nearly every window of the chunk is silence"
clipping = "Clipping: true peak at or above full scale"
long_take = "Long take: several chunks in a row without a cut"

[flag.value]
fast_cutting = "$value standard deviations above the usual"
loud = "$value standard deviations above the usual"
quiet = "$value of the chunk is silence"
clipping = "true peak $value dBFS"
long_take = "$value chunks without a cut"

[feature]
cut_rate = "Cuts per minute"
tension = "Tension (standard deviations)"

[feature.loudness]
integrated_lufs = "Loudness (LUFS)"

[feature.speech_music]
speech_ratio = "Speech"
tonal_ratio = "Non-speech and tonal"
silence_ratio = "Silence"

[feature.color]
brightness = "Brightness"
contrast = "Contrast"
colourfulness = "Colourfulness"
warmth = "Warmth"

[chart.axis]
time = "Film time (minutes)"

[chart.mark]
break = "Act break"
peak = "Tension peak"
plateau = "Pacing plateau"

[chart.cut_rate]
label = "Cuts per minute over the film"
caption = "Cuts and gradual transitions per minute, one point per chunk. Shaded: pacing plateaus."

[chart.tension]
label = "Tension over the film"
caption = "Tension, in standard deviations from the film's own average."

[chart.loudness]
label = "Loudness over the film"
caption = "Integrated loudness per chunk. A gap is a chunk with no measurable sound."

[chart.mix]
label = "Speech, non-speech and tonal sound, and silence over the film"
caption = "The share of each chunk's windows that are speech, non-speech and tonal, or silence."

[chart.picture]
label = "Brightness, contrast, colourfulness and warmth over the film"
caption = "Picture measurements per chunk. Brightness, contrast and colourfulness run from 0 to 1; warmth is red minus blue."
