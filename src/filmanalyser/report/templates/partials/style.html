<style>
{{ css }}
body { margin: 0 auto; padding: 16px; max-width: 860px; background: var(--background); color: var(--text); font-family: system-ui, sans-serif; line-height: 1.45; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.15rem; margin: 28px 0 8px; }
p { margin: 8px 0; }
p.tagline { color: var(--text-muted); margin: 0 0 16px; }
.notice { padding: 12px 16px; background: var(--surface); border: 2px solid var(--warning); border-radius: 6px; }
.notice h2 { margin: 0 0 4px; color: var(--warning); font-size: 1rem; }
.notice p { margin: 0; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 16px 0; }
dt { color: var(--text-muted); }
dd { margin: 0; }
.note { color: var(--text-muted); font-size: 0.9rem; }
table { border-collapse: collapse; width: 100%; margin: 8px 0; }
th, td { text-align: left; padding: 4px 12px 4px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-muted); font-weight: 600; }
ul { margin: 8px 0; padding-left: 20px; }
figure { margin: 0 0 16px; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
figcaption { color: var(--text-muted); font-size: 0.9rem; margin-top: 8px; }
svg { width: 100%; height: auto; display: block; }
.legend { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.9rem; }
.swatch { display: inline-block; width: 24px; vertical-align: middle; margin-right: 6px; border-top: 3px solid var(--accent); }
.axis { stroke: var(--border); stroke-width: 1; }
.tick { fill: var(--text-muted); font-size: 11px; }
.grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 1 4; }
.series { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.s1 { stroke: var(--accent); border-top-color: var(--accent); }
.s2 { stroke: var(--warning); border-top-color: var(--warning); stroke-dasharray: 6 3; border-top-style: dashed; }
.s3 { stroke: var(--text-muted); border-top-color: var(--text-muted); stroke-dasharray: 2 3; border-top-style: dotted; }
.s4 { stroke: var(--text); border-top-color: var(--text); stroke-dasharray: 8 3 2 3; border-top-style: dashed; }
.band { fill: var(--accent); fill-opacity: 0.14; }
.mark { stroke-width: 2; }
.break { stroke: var(--warning); stroke-dasharray: 5 3; }
.peak { stroke: var(--danger); }
.mark-text { font-size: 11px; stroke: var(--surface); stroke-width: 3px; paint-order: stroke; }
.mark-text.break { fill: var(--warning); }
.mark-text.peak { fill: var(--danger); }
.swatch.break { border-top-color: var(--warning); border-top-style: dashed; }
.swatch.peak { border-top-color: var(--danger); }
.swatch.band { border-top: 8px solid var(--accent); opacity: 0.3; }
.items span:not(:last-child)::after { content: ", "; }
</style>
